<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>MyBible.Help</title>

    <!-- ✅ 样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="box">
    <!-- ✅ 书卷下拉 -->
    <div class="select-row">
        <div class="select-group">
            <select id="book" onchange="onBookChange(this)">
                <option value="">-- 请选择书卷 --</option>
                {% for b in books %}
                    <option value="{{ b.id }}"
                        {% if b.id == default_book_id %}selected{% endif %}>
                        {{ b.name_cn }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- ✅ 章节下拉 -->
        <div class="select-group">
            <select id="chapter" onchange="onChapterChange(this)">
                <option value="">-- 请选择章 --</option>
                <option value="{{ default_chapter }}" selected>
                    {{ default_chapter }}
                </option>
            </select>
        </div>
    </div>
</div>

<div id="verses" class="verses-container"></div>

<div class="player">
    <button onclick="playAudio()">▶ 播放</button>
    <button onclick="pauseAudio()">⏸ 暂停</button>
    <button onclick="stopAudio()">⏹ 停止</button>

    <progress id="progress" value="0" max="100"></progress>
</div>

<audio id="audio-player" preload="auto"></audio>

<!-- JS -->
<script src="{{ url_for('static', filename='js/highlight.js') }}"></script>
<script src="{{ url_for('static', filename='js/player.js') }}"></script>

<script src="{{ url_for('static', filename='js/book.js') }}"></script>
<script src="{{ url_for('static', filename='js/chapter.js') }}"></script>
<script src="{{ url_for('static', filename='js/verse.js') }}"></script>

<script src="{{ url_for('static', filename='js/entity.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
