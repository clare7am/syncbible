<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>MyBible.Help</title>

    <!-- 样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="box">
    <!-- 书卷下拉 -->
    <div class="select-row">
        <div class="select-group">
            <select id="book" onchange="onBookChange(this)">
                <option value="">-- 请选择书卷 --</option>
                {% for b in books %}
                    <option value="{{ b.id }}"
                        {% if b.id == default_book_id %}selected{% endif %}>
                        {{ b.name_cn }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- 章节下拉 -->
        <div class="select-group">
            <select id="chapter" onchange="onChapterChange(this)">
                <option value="">-- 请选择章 --</option>
                <option value="{{ default_chapter }}" selected>
                    {{ default_chapter }}
                </option>
            </select>
        </div>
    </div>
</div>

<!-- 保证所有书卷切换都能安全显示状态 
<div id="info" class="info-text"></div> -->

<div id="verses" class="verses-container"></div>

<div class="player">
    <!-- 播放 / 暂停 按钮（SVG 图标版） -->
    <button id="play-pause-btn" onclick="togglePlay()" aria-label="播放 / 暂停">
        <!-- 播放 ▶ -->
        <svg id="icon-play" class="ctrl-icon" viewBox="0 0 24 24" width="22" height="22"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <polygon points="6 3 20 12 6 21 6 3"/>
        </svg>

        <!-- 暂停 ⏸ -->
        <svg id="icon-pause" class="ctrl-icon" viewBox="0 0 24 24" width="22" height="22"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             style="display:none">
            <line x1="6" y1="4" x2="6" y2="20"/>
            <line x1="18" y1="4" x2="18" y2="20"/>
        </svg>
    </button>

    <!-- 停止 
    <button onclick="stopAudio()" aria-label="停止">⏹</button>
    -->

    <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
    >
</div>

<audio id="audio-player" preload="auto"></audio>

<!-- JS -->
<script src="{{ url_for('static', filename='js/highlight.js') }}"></script>
<script src="{{ url_for('static', filename='js/player.js') }}"></script>

<script src="{{ url_for('static', filename='js/book.js') }}"></script>
<script src="{{ url_for('static', filename='js/chapter.js') }}"></script>
<script src="{{ url_for('static', filename='js/verse.js') }}"></script>

<script src="{{ url_for('static', filename='js/entity.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
