<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Bible</title>

    <!-- 桌面图标 -->
    <link rel="icon" href="https://c7-pic.oss-cn-beijing.aliyuncs.com/alpha_omega_2.png">
    <link rel="apple-touch-icon" href="https://c7-pic.oss-cn-beijing.aliyuncs.com/alpha_omega_2.png">

    <!-- iOS 全屏 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- 样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="box">
    <!-- 书卷下拉 -->
    <div class="select-row">
        <div class="select-group">
            <select id="book" onchange="onBookChange(this)">
                {% for b in books %}
                    <option value="{{ b.id }}"
                        {% if b.id == 1 %}selected{% endif %}>   <!-- 默认创世纪 -->
                        {{ b.name_cn }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- 章节下拉 -->
        <div class="select-group">
            <select id="chapter" onchange="onChapterChange(this)">
                <option value="1" selected>1</option>   <!-- 默认第一章 -->
            </select>
        </div>
    </div>
</div>

<!-- 保证所有书卷切换都能安全显示状态 
<div id="info" class="info-text"></div> -->

<div id="verses" class="verses-container"></div>

<div class="player">
    <!-- 播放 / 暂停 按钮（SVG 图标版） -->
    <button id="play-pause-btn" onclick="togglePlay()" aria-label="播放 / 暂停">
        <!-- 播放 ▶ -->
        <svg id="icon-play" class="ctrl-icon" viewBox="0 0 24 24" width="24" height="24"
             fill="currentColor" stroke="none">
            <path d="M8 5v14l11-7z"/>
        </svg>

        <!-- 暂停 ⏸ -->
        <svg id="icon-pause" class="ctrl-icon" viewBox="0 0 24 24" width="24" height="24"
             fill="currentColor" stroke="none">
            <path d="M6 4h4v16H6zm8 0h4v16h-4z"/>
        </svg>
    </button>

    <!-- 停止 
    <button onclick="stopAudio()" aria-label="停止">⏹</button>
    -->

    <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
    >
</div>

<audio id="audio-player" preload="none"></audio>

<!-- JS -->
<script src="{{ url_for('static', filename='js/highlight.js') }}"></script>
<script src="{{ url_for('static', filename='js/player.js') }}"></script>

<script src="{{ url_for('static', filename='js/book.js') }}"></script>
<script src="{{ url_for('static', filename='js/chapter.js') }}"></script>
<script src="{{ url_for('static', filename='js/verse.js') }}"></script>

<script src="{{ url_for('static', filename='js/entity.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
